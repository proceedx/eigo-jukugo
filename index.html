<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f2027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英熟語">
<title>高校入試対策 英熟語トレーニング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  :root {
    --bg: #0f2027;
    --bg2: #203a43;
    --bg3: #2c5364;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --accent3: #34d399;
    --text: #e8f4f8;
    --text2: #94a3b8;
    --text3: #cbd5e1;
    --card: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
    min-height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
  }

  /* ヘッダー */
  .header {
    width: 100%; max-width: 600px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .header-logo { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
  .header-btn {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 14px; font-family: inherit; padding: 4px 8px;
  }
  .header-sub { color: var(--text2); font-size: 13px; }

  /* カード */
  .card {
    width: 100%; max-width: 600px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin: 20px 16px 0;
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }

  /* スクリーン制御 */
  .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
  .screen.active { display: flex; }

  /* タイトル */
  .page-title { font-size: 24px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 6px; }
  .page-sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 24px; }

  /* 統計バッジ */
  .stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 28px; }
  .stat-item { text-align: center; }
  .stat-num { font-size: 24px; font-weight: 900; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text2); }

  /* ボタン */
  .btn {
    display: block; width: 100%;
    padding: 14px 0; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-bottom: 12px; transition: opacity .2s, transform .1s;
    font-family: inherit;
  }
  .btn:active { transform: scale(.97); opacity: .85; }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text3); border: 1px solid var(--border); }
  .btn-success { background: linear-gradient(90deg, var(--accent3), #10b981); color: #fff; }
  .btn-half {
    flex: 1; padding: 13px 0; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: opacity .2s, transform .1s;
  }
  .btn-half:active { transform: scale(.97); }
  .btn-row { display: flex; gap: 12px; margin-top: 12px; }

  /* チェックボックスラベル */
  .check-label {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05); cursor: pointer; font-size: 14px;
    border: 1px solid transparent; transition: border-color .2s;
  }
  .check-label:hover { border-color: var(--border); }
  .check-label input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .check-label .badge {
    margin-left: auto; background: var(--accent); color: var(--bg);
    border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700;
  }

  /* セクション見出し */
  .section-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; margin-top: 4px; }

  /* プログレスバー */
  .progress-wrap { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width .3s; }

  /* 問題ボックス */
  .question-box {
    background: rgba(56,189,248,0.1); border-radius: 14px;
    padding: 28px 20px; margin-bottom: 20px;
    border: 1px solid rgba(56,189,248,0.3); text-align: center;
  }
  .question-hint { font-size: 11px; color: var(--accent); margin-bottom: 10px; letter-spacing: .1em; }
  .question-text { font-size: 22px; font-weight: 900; color: #fff; line-height: 1.4; }

  /* 解答ボックス */
  .answer-box {
    background: rgba(129,140,248,0.1); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
    border: 1px solid rgba(129,140,248,0.3);
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .answer-meaning { font-size: 17px; color: #c7d2fe; font-weight: 700; margin-bottom: 10px; }
  .answer-use { font-size: 13px; color: var(--text2); white-space: pre-line; line-height: 1.9; }
  .answer-use .en { color: var(--text3); }
  .answer-use .ja { color: var(--text2); font-size: 12px; }

  /* カウンター */
  .counter { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 16px; }

  /* 覚えたチェック */
  .memorized-label {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 10px; margin-bottom: 16px;
    background: rgba(52,211,153,0.1); cursor: pointer; font-size: 14px;
    border: 1px solid rgba(52,211,153,0.2); color: var(--accent3);
  }
  .memorized-label input { width: 18px; height: 18px; accent-color: var(--accent3); cursor: pointer; }

  /* 結果画面 */
  .result-emoji { font-size: 52px; text-align: center; margin-bottom: 12px; }
  .result-score { font-size: 42px; font-weight: 900; color: var(--accent); text-align: center; margin: 16px 0 6px; }
  .result-total { font-size: 16px; color: var(--text2); }
  .result-percent { font-size: 14px; color: var(--text2); text-align: center; margin-bottom: 24px; }
  .result-bar-wrap { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-bottom: 28px; overflow: hidden; }
  .result-bar { height: 100%; background: linear-gradient(90deg, var(--accent3), #10b981); border-radius: 5px; transition: width .8s ease; }

  /* 一覧タブ */
  .tab-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab-btn {
    padding: 6px 13px; border-radius: 20px; border: none;
    font-size: 12px; cursor: pointer; font-weight: 700; font-family: inherit;
    transition: all .2s;
  }
  .tab-btn.active { background: var(--accent); color: var(--bg); }
  .tab-btn.inactive { background: rgba(255,255,255,0.1); color: var(--text2); }
  .cat-desc { font-size: 11px; color: var(--text2); margin-bottom: 14px; }

  /* 一覧行 */
  .list-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .list-num { font-size: 11px; color: #475569; width: 26px; padding-top: 2px; flex-shrink: 0; }
  .list-title { font-size: 14px; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
  .list-meaning { font-size: 13px; color: var(--text3); }
  .list-use { font-size: 12px; color: #475569; margin-top: 3px; white-space: pre-line; line-height: 1.6; }

  /* トグルスイッチ */
  .toggle-wrap { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,0.05); margin-bottom: 8px; }
  .toggle-label { font-size: 14px; color: var(--text3); }
  .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.2); border-radius: 24px; transition: .3s;
  }
  .toggle-slider:before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s;
  }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }

  /* 選択した語数 */
  .count-display {
    text-align: center; padding: 14px;
    background: rgba(56,189,248,0.1); border-radius: 10px;
    margin: 16px 0; border: 1px solid rgba(56,189,248,0.2);
  }
  .count-display .num { font-size: 28px; font-weight: 900; color: var(--accent); }
  .count-display .lbl { font-size: 12px; color: var(--text2); }

  /* スクロール */
  .list-scroll { max-height: 65vh; overflow-y: auto; padding-right: 4px; }
  .list-scroll::-webkit-scrollbar { width: 4px; }
  .list-scroll::-webkit-scrollbar-track { background: transparent; }
  .list-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
</style>
</head>
<body>

<!-- ===== TOP ===== -->
<div id="screen-top" class="screen active">
  <div class="card" style="margin-top:52px; text-align:center;">
    <div style="font-size:40px; margin-bottom:12px;">🇬🇧</div>
    <div class="page-title">英熟語トレーニング</div>
    <div class="page-sub">高校入試対策 ｜ 全422語収録</div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">9</div><div class="stat-label">カテゴリ</div></div>
      <div class="stat-item"><div class="stat-num">422</div><div class="stat-label">熟語数</div></div>
      <div class="stat-item"><div class="stat-num" id="top-memorized">0</div><div class="stat-label">覚えた語</div></div>
    </div>
    <button class="btn btn-primary" onclick="goOption()">学習スタート ▶</button>
    <button class="btn btn-secondary" onclick="goList()">熟語一覧を見る</button>
  </div>
</div>

<!-- ===== OPTION ===== -->
<div id="screen-option" class="screen">
  <div class="header">
    <button class="header-btn" onclick="goTop()">← 戻る</button>
    <div class="header-logo">学習設定</div>
    <div></div>
  </div>
  <div class="card">
    <div class="section-title">カテゴリを選択（未選択 = 全カテゴリ）</div>
    <div id="cat-checks"></div>

    <div style="margin-top:16px;">
      <div class="toggle-wrap">
        <span class="toggle-label">🔀 シャッフルモード（ランダム順）</span>
        <label class="toggle"><input type="checkbox" id="shuffle-toggle"><span class="toggle-slider"></span></label>
      </div>
      <div class="toggle-wrap">
        <span class="toggle-label">⭐ 未習得のみ（覚えた語を除く）</span>
        <label class="toggle"><input type="checkbox" id="unstudied-toggle"><span class="toggle-slider"></span></label>
      </div>
    </div>

    <div class="count-display">
      <div class="num" id="selected-count">422</div>
      <div class="lbl">語を学習します</div>
    </div>
    <button class="btn btn-primary" onclick="startStudy()">スタート ▶</button>
  </div>
</div>

<!-- ===== STUDY ===== -->
<div id="screen-study" class="screen">
  <div class="header">
    <button class="header-btn" onclick="goOption()">← 戻る</button>
    <div class="header-logo" id="study-counter">1 / 422</div>
    <button class="header-btn" style="color:#64748b;" onclick="goResult()">終了</button>
  </div>
  <div style="width:100%;max-width:600px;padding:0 16px;">
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div class="question-box">
      <div class="question-hint">次の熟語の意味は？</div>
      <div class="question-text" id="question-text"></div>
    </div>
    <div id="answer-area" style="display:none;">
      <div class="answer-box">
        <div class="answer-meaning" id="answer-meaning"></div>
        <div class="answer-use" id="answer-use"></div>
      </div>
      <label class="memorized-label">
        <input type="checkbox" id="memorized-check" onchange="toggleMemorized()">
        <span>✓ 覚えた！</span>
      </label>
    </div>
    <button class="btn btn-primary" id="show-answer-btn" onclick="showAnswer()">意味を見る 👀</button>
    <button class="btn btn-success" id="next-btn" style="display:none;" onclick="nextQuestion()">次へ ▶</button>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div class="card" style="margin-top:52px; text-align:center;">
    <div class="result-emoji">🎉</div>
    <div class="page-title">学習完了！</div>
    <div class="result-score"><span id="result-checked">0</span><span class="result-total"> / <span id="result-total">0</span></span></div>
    <div class="result-percent" id="result-percent">正答率 0%</div>
    <div class="result-bar-wrap"><div class="result-bar" id="result-bar" style="width:0%"></div></div>
    <button class="btn btn-primary" onclick="retryStudy()">もう一度</button>
    <button class="btn btn-secondary" onclick="goOption()">設定に戻る</button>
    <button class="btn btn-secondary" onclick="goTop()">トップへ</button>
  </div>
</div>

<!-- ===== LIST ===== -->
<div id="screen-list" class="screen">
  <div class="header">
    <button class="header-btn" onclick="goTop()">← 戻る</button>
    <div class="header-logo">熟語一覧</div>
    <div></div>
  </div>
  <div class="card">
    <div class="tab-row" id="list-tabs"></div>
    <div class="cat-desc" id="list-cat-desc"></div>
    <div class="list-scroll" id="list-body"></div>
  </div>
</div>

<script>
// ===== データ =====
const CAT_NAMES = {
  1:"A〜C（a couple of〜 cut down）",
  2:"D〜F（day after day〜 from time to time）",
  3:"G〜I（generally speaking〜 It takes...）",

uess you're right.\n君は正しいと思う"},{"key":422,"cat":8,"title":"will you?","idiom":"will you?　　～してくれませんか？","use":"Will you do it?\nしますか？"}];

// ===== 状態 =====
let selectedCats = {};
let currentData = [];
let questionIdx = 0;
let memorized = JSON.parse(localStorage.getItem('memorized') || '{}');
let listCat = 1;

// ===== 初期化 =====
window.onload = function() {
  buildCatChecks();
  buildListTabs();
  updateTopMemorized();
  updateSelectedCount();
};

function saveMemorized() {
  localStorage.setItem('memorized', JSON.stringify(memorized));
  updateTopMemorized();
}

function updateTopMemorized() {
  document.getElementById('top-memorized').textContent = Object.values(memorized).filter(Boolean).length;
}

// ===== カテゴリチェックボックス生成 =====
function buildCatChecks() {
  const wrap = document.getElementById('cat-checks');
  wrap.innerHTML = '';
  for (let c = 1; c <= 9; c++) {
    const cnt = DATA.filter(d => d.cat === c).length;
    const lbl = document.createElement('label');
    lbl.className = 'check-label';
    lbl.innerHTML = `<input type="checkbox" onchange="toggleCat(${c})" ${selectedCats[c] ? 'checked' : ''}><span style="flex:1;font-size:13px;">カテゴリ${c}　${CAT_NAMES[c]}</span><span class="badge">${cnt}</span>`;
    wrap.appendChild(lbl);
  }
}

function toggleCat(c) {
  selectedCats[c] = !selectedCats[c];
  updateSelectedCount();
}

function updateSelectedCount() {
  const cats = Object.keys(selectedCats).filter(k => selectedCats[k]).map(Number);
  const unstudied = document.getElementById('unstudied-toggle') && document.getElementById('unstudied-toggle').checked;
  let data = cats.length > 0 ? DATA.filter(d => cats.includes(d.cat)) : [...DATA];
  if (unstudied) data = data.filter(d => !memorized[d.key]);
  document.getElementById('selected-count').textContent = data.length;
}

// ===== 画面遷移 =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}
function goTop() { updateTopMemorized(); showScreen('top'); }
function goOption() { buildCatChecks(); updateSelectedCount(); showScreen('option'); }
function goList() { renderList(); showScreen('list'); }
function goResult() { renderResult(); showScreen('result'); }

// ===== 学習開始 =====
function startStudy() {
  const cats = Object.keys(selectedCats).filter(k => selectedCats[k]).map(Number);
  let data = cats.length > 0 ? DATA.filter(d => cats.includes(d.cat)) : [...DATA];
  const unstudied = document.getElementById('unstudied-toggle').checked;
  if (unstudied) data = data.filter(d => !memorized[d.key]);
  if (data.length === 0) { alert('学習する熟語がありません。設定を変えてください。'); return; }
  if (document.getElementById('shuffle-toggle').checked) data = [...data].sort(() => Math.random() - 0.5);
  currentData = data.map(d => ({ ...d, checked: !!memorized[d.key] }));
  questionIdx = 0;
  showScreen('study');
  renderQuestion();
}

// ===== 問題表示 =====
function renderQuestion() {
  const item = currentData[questionIdx];
  document.getElementById('study-counter').textContent = `${questionIdx + 1} / ${currentData.length}`;
  document.getElementById('progress-bar').style.width = `${((questionIdx + 1) / currentData.length) * 100}%`;
  document.getElementById('question-text').textContent = item.title;
  document.getElementById('answer-area').style.display = 'none';
  document.getElementById('show-answer-btn').style.display = 'block';
  document.getElementById('next-btn').style.display = 'none';
}

function showAnswer() {
  const item = currentData[questionIdx];
  const parts = item.idiom.split('　　');
  document.getElementById('answer-meaning').textContent = parts[1] || item.idiom;
  const useEl = document.getElementById('answer-use');
  if (item.use) {
    const lines = item.use.split('\n');
    useEl.innerHTML = lines.map((l, i) => `<span class="${i % 2 === 0 ? 'en' : 'ja'}">${l}</span>`).join('\n');
    useEl.style.display = '';
  } else {
    useEl.style.display = 'none';
  }
  document.getElementById('memorized-check').checked = !!currentData[questionIdx].checked;
  document.getElementById('answer-area').style.display = 'block';
  document.getElementById('show-answer-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('next-btn').textContent = questionIdx < currentData.length - 1 ? '次へ ▶' : '結果を見る 🎉';
}

function toggleMemorized() {
  const checked = document.getElementById('memorized-check').checked;
  currentData[questionIdx].checked = checked;
  memorized[currentData[questionIdx].key] = checked;
  saveMemorized();
}

function nextQuestion() {
  if (questionIdx < currentData.length - 1) {
    questionIdx++;
    renderQuestion();
  } else {
    goResult();
  }
}

// ===== 結果 =====
function renderResult() {
  const checkedCount = currentData.filter(d => d.checked).length;
  const total = currentData.length;
  const pct = total > 0 ? Math.round((checkedCount / total) * 100) : 0;
  document.getElementById('result-checked').textContent = checkedCount;
  document.getElementById('result-total').textContent = total;
  document.getElementById('result-percent').textContent = `正答率 ${pct}%`;
  setTimeout(() => {
    document.getElementById('result-bar').style.width = `${pct}%`;
  }, 100);
}

function retryStudy() {
  questionIdx = 0;
  currentData = currentData.map(d => ({ ...d, checked: !!memorized[d.key] }));
  showScreen('study');
  renderQuestion();
}

// ===== 一覧 =====
function buildListTabs() {
  const wrap = document.getElementById('list-tabs');
  for (let c = 1; c <= 9; c++) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn ' + (c === listCat ? 'active' : 'inactive');
    btn.textContent = c;
    btn.onclick = () => { listCat = c; renderList(); };
    wrap.appendChild(btn);
  }
}

function renderList() {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.className = 'tab-btn ' + (i + 1 === listCat ? 'active' : 'inactive');
  });
  document.getElementById('list-cat-desc').textContent = CAT_NAMES[listCat];
  const body = document.getElementById('list-body');
  const items = DATA.filter(d => d.cat === listCat);
  body.innerHTML = items.map((d, i) => {
    const meaning = d.idiom.split('　　')[1] || '';
    const useHtml = d.use ? `<div class="list-use">${d.use.replace(/\n/g, '<br>')}</div>` : '';
    return `<div class="list-row">
      <div class="list-num">${i + 1}</div>
      <div>
        <div class="list-title">${d.title}</div>
        <div class="list-meaning">${meaning}</div>
        ${useHtml}
      </div>
    </div>`;
  }).join('');
}

// オプション変更時に語数更新
document.addEventListener('DOMContentLoaded', () => {
  const ut = document.getElementById('unstudied-toggle');
  if (ut) ut.addEventListener('change', updateSelectedCount);
});
</script>
